<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Resource Library — Java / Spring Boot</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#0d1013" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F1ED" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Resources">
<style>
:root{
  --bg:#0d1013; --bg2:#111519; --panel:#151a20; --panel2:#1a2027;
  --line:#232a33; --line2:#2f3843;
  --ink:#e6ebf2; --ink-soft:#94a1b2; --ink-dim:#69747f;
  --accent:#d9a441; --accent-soft:#2a2114;
  --done:#4f9d69;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sidebar:236px;
}
html[data-theme="light"]{
  --bg:#F2F1ED; --bg2:#EBEAE5; --panel:#FAFAF8; --panel2:#F2F1EC;
  --line:#dedcd5; --line2:#c9c6bd;
  --ink:#1E242B; --ink-soft:#5b646e; --ink-dim:#868e97;
  --accent:#9a6f14; --accent-soft:#f0e7d2; --done:#3d7d52;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
a{color:inherit; text-decoration:none; border-bottom:1px solid var(--line2)}
a:hover{border-bottom-color:var(--accent)}
button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer}
select{font-family:inherit; font-size:12px; color:var(--ink-soft);
  background:var(--panel); border:1px solid var(--line); border-radius:99px;
  padding:4px 9px; outline:none; cursor:pointer}
::selection{background:var(--accent); color:#12160c}

.app{display:flex; min-height:100vh}
.sidebar{width:var(--sidebar); flex:0 0 var(--sidebar); background:var(--bg2);
  border-right:1px solid var(--line); position:fixed; inset:0 auto 0 0;
  display:flex; flex-direction:column; z-index:40; overflow-y:auto}
.main{margin-left:var(--sidebar); flex:1; min-width:0}
.brand{padding:20px 18px 12px}
.brand h1{margin:0; font-size:16px; font-weight:700; letter-spacing:-.2px}
.brand .sub{font-family:var(--mono); font-size:10px; letter-spacing:1.2px;
  text-transform:uppercase; color:var(--ink-dim); margin-top:5px}
.cats{padding:6px 10px; display:flex; flex-direction:column; gap:1px}
.cats button{display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  background:none; border:0; padding:7px 10px; border-radius:6px;
  color:var(--ink-soft); font-size:13.5px}
.cats button:hover{background:var(--panel); color:var(--ink)}
.cats button.on{background:var(--panel); color:var(--ink); font-weight:600}
.cats .n{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-dim)}
.cats .divider{height:1px; background:var(--line); margin:8px 4px}
.side-foot{margin-top:auto; padding:14px; border-top:1px solid var(--line);
  display:flex; gap:5px}
.side-foot button{flex:1; background:none; border:1px solid var(--line);
  border-radius:6px; padding:5px 4px; font-size:11px; color:var(--ink-dim)}
.side-foot button:hover{border-color:var(--line2); color:var(--ink-soft)}

.topbar{position:sticky; top:0; z-index:30; background:var(--bg);
  border-bottom:1px solid var(--line); padding:10px 28px 0}
.toprow{display:flex; align-items:center; gap:12px; padding-bottom:10px}
.searchwrap{position:relative; flex:1; max-width:380px}
.searchwrap input{width:100%; background:var(--panel); border:1px solid var(--line);
  border-radius:7px; padding:7px 12px 7px 31px; color:var(--ink);
  font-family:inherit; font-size:13px; outline:none}
.searchwrap input:focus{border-color:var(--line2)}
.searchwrap .mag{position:absolute; left:11px; top:50%; transform:translateY(-50%);
  color:var(--ink-dim); font-size:12px; pointer-events:none}
.facets{display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  padding-bottom:10px}
.facets .lbl{font-family:var(--mono); font-size:9.5px; letter-spacing:1.1px;
  text-transform:uppercase; color:var(--ink-dim); margin-right:2px}
.chip{background:none; border:1px solid var(--line); border-radius:99px;
  padding:4px 11px; font-size:12px; color:var(--ink-dim); white-space:nowrap}
.chip:hover{border-color:var(--line2); color:var(--ink-soft)}
.chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.spacer{flex:1}
.count{font-family:var(--mono); font-size:11px; color:var(--ink-dim)}

.view{padding:28px 28px 100px; max-width:840px}
.vhead{margin:0 0 5px; font-size:23px; font-weight:700; letter-spacing:-.3px}
.vsub{margin:0 0 4px; color:var(--ink-soft); font-size:14px; max-width:64ch}
.sec{font-family:var(--mono); font-size:10px; letter-spacing:1.3px;
  text-transform:uppercase; color:var(--ink-dim);
  margin:30px 0 4px; padding-bottom:6px; border-bottom:1px solid var(--line)}
.empty{padding:40px 0; text-align:center; color:var(--ink-dim); font-size:14px}

/* ---- resource row ---- */
.res{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
.res.hidden{display:none}
.mark{flex:0 0 auto; background:none; border:0; padding:2px 0 0;
  font-size:13px; line-height:1; color:var(--ink-dim); width:18px; text-align:center}
.mark:hover{color:var(--accent)}
.mark.saved{color:var(--accent)}
.mark.done{color:var(--done)}
.rbody{flex:1; min-width:0}
.rtop{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.rname{font-size:14px}
.res.is-done .rname{color:var(--ink-dim); text-decoration:line-through}
.status{font-family:var(--mono); font-size:9.5px; letter-spacing:.8px;
  text-transform:uppercase; color:var(--ink-dim); border:1px solid var(--line2);
  border-radius:99px; padding:1px 7px; white-space:nowrap}
.status.s-start{color:var(--accent); border-color:var(--accent)}
.meta{font-family:var(--mono); font-size:10.5px; color:var(--ink-dim);
  letter-spacing:.3px}
.rdesc{font-size:12.8px; color:var(--ink-soft); margin-top:3px; max-width:62ch}
.how{margin:6px 0 0; padding-left:17px; font-size:12.4px; color:var(--ink-soft)}
.how li{margin:2px 0}
.tag-ar{color:var(--accent)}

/* ---- method view ---- */
.mcard{border-left:1px solid var(--line2); padding:2px 0 2px 14px; margin-bottom:16px}
.mcard .mn{font-family:var(--mono); font-size:10px; color:var(--ink-dim)}
.mcard .mt{font-size:14px; font-weight:600; margin:2px 0 5px}
.mcard .mb{font-size:12.8px; color:var(--ink-soft)}
.note{font-size:12.5px; color:var(--ink-dim); margin-top:6px}
.grid2{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.term{border:1px solid var(--line); border-radius:8px; padding:14px 16px;
  font-family:var(--mono); font-size:12px; line-height:1.75; color:var(--ink-soft);
  background:var(--panel); overflow-x:auto}
.term .tt{color:var(--ink-dim); font-size:9.5px; letter-spacing:1.2px;
  text-transform:uppercase; margin-bottom:8px}
.term .c{color:var(--ink-dim)}
.acc{border-top:1px solid var(--line)}
.acc-head{display:flex; align-items:center; gap:10px; width:100%; background:none;
  border:0; padding:11px 2px; text-align:left; color:inherit}
.acc-head:hover{color:var(--accent)}
.acc-head .chev{color:var(--ink-dim); font-size:10px; width:12px;
  transition:transform .18s ease}
.acc.closed .chev{transform:rotate(-90deg)}
.acc-head .t{font-size:13.8px; flex:1}
.acc-head .n{font-family:var(--mono); font-size:10.5px; color:var(--ink-dim)}
.acc-body{padding:0 2px 16px 22px}
.acc.closed .acc-body{display:none}
.prompt{border-top:1px solid var(--line); padding:11px 0}
.prompt .plab{font-size:13.3px; font-weight:600; margin-bottom:6px;
  display:flex; align-items:center; gap:8px}
.prompt pre{margin:0; font-family:var(--mono); font-size:11.6px; line-height:1.55;
  white-space:pre-wrap; color:var(--ink-soft); background:var(--panel);
  border:1px solid var(--line); border-radius:6px; padding:10px}
.copy{margin-left:auto; background:none; border:1px solid var(--line);
  border-radius:5px; padding:2px 9px; font-size:10.5px; color:var(--ink-dim)}
.copy:hover{border-color:var(--accent); color:var(--accent)}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line);
  vertical-align:top}
th{font-family:var(--mono); font-size:9.5px; letter-spacing:1px;
  text-transform:uppercase; color:var(--ink-dim); font-weight:500}
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px}

/* ---- sync ---- */
.syncrow{display:flex; align-items:center; gap:8px; width:100%; background:none;
  border:0; padding:8px 10px; border-radius:6px; color:var(--ink-dim);
  font-size:12px; text-align:left}
.syncrow:hover{background:var(--panel); color:var(--ink-soft)}
.dot{width:7px; height:7px; border-radius:50%; background:var(--ink-dim); flex:0 0 auto}
.dot.ok{background:var(--done)}
.dot.busy{background:var(--accent); animation:pulse 1s ease-in-out infinite}
.dot.err{background:#c8664f}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.field{margin-bottom:16px; max-width:520px}
.field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px}
.field input{width:100%; background:var(--panel); border:1px solid var(--line);
  border-radius:7px; padding:8px 11px; color:var(--ink); font-family:var(--mono);
  font-size:12.5px; outline:none}
.field input:focus{border-color:var(--accent)}
.field .hint{font-size:11.5px; color:var(--ink-dim); margin-top:5px}
.btn{background:var(--panel); border:1px solid var(--line2); border-radius:7px;
  padding:7px 14px; font-size:13px; color:var(--ink)}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px}
.log{font-family:var(--mono); font-size:11.5px; color:var(--ink-dim);
  border-left:1px solid var(--line2); padding-left:12px; margin-top:18px}
.log div{padding:2px 0}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--panel); border:1px solid var(--line2); border-radius:7px;
  padding:9px 16px; font-size:13px; z-index:99; opacity:0; pointer-events:none;
  transition:opacity .2s; box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.on{opacity:1}
.menu-btn{display:none; background:none; border:1px solid var(--line);
  border-radius:6px; padding:5px 9px}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%); transition:transform .2s ease}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .menu-btn{display:block}
  .view{padding:20px 15px 80px}
  .topbar{padding:10px 15px 0}
}
@media print{
  .sidebar,.topbar,.mark,.copy,.menu-btn{display:none!important}
  .main{margin-left:0}
  .view{padding:0; max-width:none}
  .acc.closed .acc-body{display:block!important}
  .res.hidden{display:flex!important}
  body{background:#fff;color:#000;font-size:11pt}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:8pt;color:#555}
}
</style>
</head>

<div class="app">
  <aside class="sidebar" id="sidebar">

      <button id="btn-print">Print</button>

      <div class="facets" id="facets"></div>
    </div>
    <main id="view" class="view"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

rograms — Full List","items":[{"name":"OSS Programs Community List (GitHub)","url":"https://github.com/yashisrani/List-of-OpenSource-Programs","type":"resource","cost":"free","status":"start","star":true,"desc":"Comprehensive community-maintained list of all open source programs, fellowships, and internships. Check this every 3 months to find the right program for your current level.","cat":"oss","sub":"OSS Programs — Full List","lang":"en","origin":["library","phase-refs"],"extra":{}},{"name":"Hacktoberfest","url":"https://hacktoberfest.com","type":"program","cost":"free","status":"start","star":false,"desc":"October every year. Make 4 merged PRs in participating repos. Start from P2+ — good momentum builder.","cat":"oss","sub":"OSS Programs — Full List","lang":"en","origin":["library","oss-programs"],"extra":{}},{"name":"Outreachy","url":"https://www.outreachy.org","type":"program","cost":"free","status":"start","star":false,"desc":"Paid 3-month internship. Focuses on underrepresented groups. Two rounds per year (May-Aug, Dec-Mar). Fully remote and international.","cat":"oss","sub":"OSS Programs — Full List","lang":"en","origin":["library","oss-programs"],"extra":{}},{"name":"24 Pull Requests","url":"https://24pullrequests.com","type":"program","cost":"free","status":"alt","star":false,"desc":"December event: make small PRs every day. Good early habit builder from P2+.","cat":"oss","sub":"OSS Programs — Full List","lang":"en","origin":["library","oss-programs"],"extra":{}},{"name":"Apache Community Development","url":"https://community.apache.org","type":"program","cost":"free","status":"alt","star":false,"desc":"Pure Java foundation: Maven, Tomcat, Kafka. No stipend but very high reputation. Contribute here and GSoC orgs notice you.","cat":"oss","sub":"OSS Programs — Full List","lang":"en","origin":["library","oss-programs"],"extra":{}},{"name":"GirlScript Summer of Code (GSSoC)","url":"https://gssoc.girlscript.tech","type":"program","cost":"free","status":"alt", ting Workflow","lang":"en","origin":["library"],"extra":{}},{"name":"Step 3: Comment on the issue before coding","url":null,"type":"process","cost":"free","status":"start","star":false,"desc":"Say you want to work on it. Briefly describe your approach. Maintainers confirm if the approach is right. Gets you assigned so nobody else picks it up.","cat":"oss","sub":"Contributing Workflow","lang":"en","origin":["library"],"extra":{}},{"name":"Step 4: Fork, branch, small focused changes","url":null,"type":"process","cost":"free","status":"start","star":false,"desc":"One PR equals one concern. Never bundle unrelated changes. Branch name: fix/null-pointer-in-parser or feat/add-java17-support. Small PRs get reviewed and merged faster.","cat":"oss","sub":"Contributing Workflow","lang":"en","origin":["library"],"extra":{}},{"name":"Step 5: Add or update tests for your change","url":null,"type":"process","cost":"free","status":"start","star":false,"desc":"Projects reject PRs without tests for new behavior. Run the full test suite locally before pushing.","cat":"oss","sub":"Contributing Workflow","lang":"en","origin":["library"],"extra":{}},{"name":"Step 6: Respond to review comments within 48 hours","url":null,"type":"process","cost":"free","status":"alt","star":false,"desc":"Speed of response matters more than perfection. Maintainers review many PRs — a PR that goes unresponded for weeks gets stale and closed.","cat":"oss","sub":"Contributing Workflow","lang":"en","origin":["library"],"extra":{}},{"name":"Step 7: Stay engaged after merge","url":null,"type":"process","cost":"free","status":"alt","star":false,"desc":"After your first merge: keep watching the project. Answer questions from others, help with related issues. This is how you get invited to be a maintainer.","cat":"oss","sub":"Contributing Workflow","lang":"en","origin":["library"],"extra":{}}]},{"name":"More on this","items":[{"name":"GSoC Past Projects Archive","url":"https://summerofcode.withgoogle.com/archive","t  Talk about your actual life: coding, Islam, comics, career goals.","cat":"eng","sub":"Pronunciation & Speaking","lang":"en","origin":["library"],"extra":{}},{"name":"BoldVoice","url":"https://www.boldvoice.com","type":"platform","cost":"paid","status":"start","star":false,"desc":"AI accent coach. 10 min/day. Record yourself weekly, compare to native speakers.","cat":"eng","sub":"Pronunciation & Speaking","lang":"en","origin":["library"],"extra":{}},{"name":"English Sounds (app)","url":null,"type":"platform","cost":"freemium","status":"start","star":false,"desc":"Master every English phoneme. IPA chart alongside. 10 min/day. Start in Month 2.","cat":"eng","sub":"Pronunciation & Speaking","lang":"en","origin":["library"],"extra":{}},{"name":"iStoria","url":"https://istoria.io","type":"platform","cost":"freemium","status":"alt","star":false,"desc":"Story-based conversations. Push toward longer, more natural outputs.","cat":"eng","sub":"Pronunciation & Speaking","lang":"en","origin":["library"],"extra":{}},{"name":"TalkEnglish (app)","url":"https://www.talkenglish.com","type":"platform","cost":"free","status":"alt","star":false,"desc":"Daily speaking practice and situational phrases.","cat":"eng","sub":"Pronunciation & Speaking","lang":"en","origin":["library"],"extra":{}}]},{"name":"More on this","items":[{"name":"Voscreen — English Immersion","url":"https://voscreen.com","type":"platform","cost":"free","status":"stuck","star":false,"desc":"10 min/day. Short video clips with English subtitles. Builds listening comprehension fast.","cat":"eng","sub":"More on this","lang":"en","origin":["phase-refs"],"extra":{}},{"name":"iTalki — Conversation Practice","url":"https://www.italki.com","type":"platform","cost":"paid","status":"deep","star":false,"desc":"Start weekly conversations from P3. 30 min/week with a community tutor. The single fastest way to improve speaking.","cat":"eng","sub":"More on this","lang":"en","origin":["phase-refs"],"extra":{}}]}]},{"id":"build","name": ,"desc":"Upload and process images with async processing pipeline and status tracking.","cat":"build","sub":"Advanced","lang":"en","origin":["projects","shelf-projects"],"extra":{"skills":["Image Processing","Async","File Handling"],"steps":["Add image upload endpoint","Implement processing queue","Add async workers","Build status tracking"],"diff":"advanced"}},{"name":"Messaging Platform Backend","url":"https://github.com/topics/messaging-platform","type":"project","cost":"free","status":"alt","star":false,"desc":"Real-time messaging backend with E2E encryption and contact synchronization.","cat":"build","sub":"Advanced","lang":"en","origin":["projects","shelf-projects"],"extra":{"skills":["Real-time","Encryption","Sockets","Chat"],"steps":["Design message model","Implement WebSocket chat","Add E2E encryption","Build contact sync"],"diff":"advanced"}},{"name":"Movie Reservation System","url":"https://github.com/topics/reservation-system","type":"project","cost":"free","status":"deep","star":false,"desc":"Reserve movie tickets with seat selection, scheduling, and payment integration.","cat":"build","sub":"Advanced","lang":"en","origin":["projects"],"extra":{"skills":["SQL","Transactions","Scheduling","Payment"],"steps":["Design complex schema","Implement seat reservation","Add transaction safety","Integrate payments"],"diff":"advanced"}},{"name":"Real-time Leaderboard","url":"https://github.com/topics/leaderboard","type":"project","cost":"free","status":"deep","star":false,"desc":"Real-time ranking/scoring system using Redis Sorted Sets with NLP integration.","cat":"build","sub":"Advanced","lang":"en","origin":["projects"],"extra":{"skills":["Redis Sorted Sets","NLP","SQL"],"steps":["Setup Redis sorted sets","Implement scoring API","Add real-time updates","Build leaderboard queries"],"diff":"advanced"}},{"name":"Scalable E-Commerce Platform","url":"https://github.com/topics/microservices","type":"project","cost":"free","status":"deep","star":false,"desc":"E-commerce "Markdown Note-taking API","url":"https://github.com/topics/markdown-notes","type":"project","cost":null,"status":"alt","star":false,"desc":"Note-taking API with Markdown support, file upload, and search. Intermediate.","cat":"build","sub":"More project ideas","lang":"en","origin":["shelf-projects"],"extra":{}}]},{"name":"From the path","items":[{"name":"[BOOK P1] Javeats Lite — Restaurant Ordering API","url":null,"type":"project","cost":"free","status":"alt","star":false,"desc":"From 'Become a Java Full-Stack Developer' (Sidharth Sahoo). Build the Spring Boot backend only — skip JavaFX and use Swagger UI as your interface. A complete food ordering REST API.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Entities follow the book ERD (p.15-17): User, Restaurant, Menu, Order — model each with @Entity and proper FK relationships","CRUD endpoints for Restaurants: GET all (paginated), GET by id, POST, PUT, DELETE","Menu endpoints: GET menus by restaurant, POST new menu item with price validation","Cart logic in the Service layer: add item, modify quantity, validate availability, calculate total","Place Order endpoint: save Order to DB, trigger confirmation flow, validate user is authenticated","Spring Security: /auth/register (hash password), /auth/login (return JWT), secure /order/* endpoints","Integration tests: register → login → add item → place order end-to-end","README: what it does, ERD diagram, Swagger link, docker-compose up instructions"],"search":"spring boot restaurant menu api github","clone":null}},{"name":"[BOOK P2] HealthMate Lite — Fitness Tracking API","url":null,"type":"project","cost":"free","status":"alt","star":false,"desc":"From the book (Chapter 2). A fitness tracking REST API: steps, goals, calorie intake. Introduces more complex per-user data relationships.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Entities from book ERD (p.26): User (with age, weight, height, gender), FitnessActivity, Goal, CalorieIntake — all with Many-to-One to User","Steps tracking: POST /activity (steps + date), GET /activity (by date range, returns total steps)","Goal management: POST /goal (target_steps + deadline), GET /goal/progress — calculates % complete based on recent activities","Calorie tracking: POST /calorie (calories + date + additional_details), GET /calorie/summary?date=... — returns daily total","Algorithm: daily step progress calculator comparing actual steps to nearest active goal","Spring Security: users only see their own activity, goals, and calorie data","Business rule: goals cannot have deadlines in the past, steps must be positive integers","Clean Code rule: apply naming and function-size refactoring from your reading to EVERY service class in this project"],"search":"spring boot health tracker api github","clone":null}},{"name":"[BOOK P3] StockSavvy Lite — Stock Portfolio API","url":null,"type":"project","cost":"free","status":"alt","star":false,"desc":"From the book (Chapter 3). Portfolio management backend integrating with a stock market API. Introduces external API consumption.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Entities from book ERD (p.37): User, Stocks (symbol, name, price, quantity, purchase_price) — Stocks has FK to User","Portfolio CRUD: GET /portfolio (all user's stocks with current value calculated), POST /portfolio (add stock), DELETE /portfolio/{stockId}","External API integration: fetch real prices from Alpha Vantage free tier (https://www.alphavantage.co) — store API key in env var, not code","Portfolio statistics endpoint: GET /portfolio/stats — returns { totalValue, totalCost, gainLoss, gainLossPercent }","Stock search endpoint: GET /stocks/search?symbol=AAPL — proxies external API and caches results 5 min with Spring Cache","Spring Security: each user's portfolio is private","Error handling: what happens when external API is down? Return cached price + flag stale data in response"],"search":"spring boot stock portfolio api github","clone":null}},{"name":"[BOOK P4] BudgetBlitz Lite — Personal Finance API","url":null,"type":"project","cost":"free","status":"alt","star":false,"desc":"From the book. A personal finance REST API tracking income, expenses, savings, and categories. Excellent real-world CRUD practice with financial calculations.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Entities from book ERD (p.48): User, Income, Expense, Category — note Category has no user FK (shared categories)","Seed 10 default Categories on startup: Food, Rent, Transport, Health, Entertainment etc. using data.sql","Income CRUD: POST /income, GET /income (paginated, filter by date range), DELETE /income/{id}","Expense CRUD: POST /expense (must reference a valid category_id), GET /expense (filter by category, date range)","Financial summary endpoint: GET /summary — returns { totalIncome, totalExpenses, savings, expenseByCategory[] }","Spring Security: JWT — each user sees only their own income/expense data","Business rules: amounts must be positive decimals, dates cannot be in the future","Integration tests: full CRUD + summary calculation with test data"],"search":"spring boot personal finance tracker api github","clone":null}},{"name":"[BOOK P5] TripTrekker Lite — Travel Booking Full Stack","url":null,"type":"project","cost":"free","status":"alt","star":false,"desc":"From the book (Chapter 5). Your full-stack capstone — complete backend + Angular frontend. The most complex of the 5 book projects.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Backend entities from book ERD (p.59): Flights, Hotels, Users, Bookings — Bookings has FK to all three","Flight search: GET /flights?origin=X&destination=Y&date=Z — filter from seeded flight data (no real API needed at first)","Hotel search: GET /hotels?location=X&checkIn=...&checkOut=... — filter from seeded hotel data","Booking endpoint: POST /bookings — validates availability (no double booking same flight seat), creates booking record","User booking history: GET /bookings/my — all bookings for authenticated user with flight/hotel details joined","Angular frontend: search form → results list → booking confirmation → my bookings page","JWT auth flow end-to-end: Angular login → store token → attach to every request → handle 401 by redirecting to login","Docker Compose: Spring Boot API + PostgreSQL + Angular (nginx) — one command starts everything","This project in your README is your full-stack job-landing asset — make it exceptional"],"search":"spring boot angular travel booking app github","clone":null}},{"name":"Add AI feature to your Library API","url":null,"type":"project","cost":"free","status":"alt","star":false,"desc":"One meaningful AI-powered feature. Not a demo — a real feature.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Option 1: AI book recommendation based on reading history (RAG)","Option 2: Natural language search across book catalog (embeddings)","Option 3: AI-powered overdue notice writer (chat completion)","Write integration tests for the AI feature","Document in README with example inputs/outputs"],"search":null,"clone":null}},{"name":"Add JWT Auth to Library API","url":null,"type":"project","cost":"free","status":"alt","star":false,"desc":"Find a Spring Security JWT reference on GitHub. Read it. Then implement JWT from scratch.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Find a Spring Security JWT repo (search above) — trace the full auth flow","Implement /auth/register and /auth/login returning JWT","Secure endpoints with @PreAuthorize","Add token refresh endpoint","Integration tests: register, login, access secured endpoint"],"search":"spring security jwt example github","clone":null}},{"name":"Angular Tour reimplement 4","url":"https://github.com/iluwatar/java-design-patterns","type":"project","cost":"free","status":"alt","star":false,"desc":"Read and reimplement 4 key patterns. They appear directly in Spring internals.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Singleton: trace, reimplement, find it in Spring ApplicationContext","Factory: trace, reimplement, find it in Spring BeanFactory","Builder: reimplement, use it in your own DTOs now","Observer: trace, find it in Spring Events"],"search":null,"clone":"git clone https://github.com/iluwatar/java-design-patterns"}},{"name":"Library API Frontend — Angular","url":null,"type":"project","cost":"free","status":"alt","star":false,"desc":"Build an Angular frontend that connects to your Phase 3-4 Library API.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Login/logout flow with JWT stored in memory — not localStorage","Book list with search and pagination","Borrow and return book flow with member selection","Admin panel: add/edit/delete books and members","Error handling: expired token redirects to login","Responsive design: works on mobile and desktop"],"search":null,"clone":null}},{"name":"Library REST API — your portfolio project","url":null,"type":"project","cost":"free","status":"alt","star":false,"desc":"Rebuild your Library app as a Spring Boot REST API. This is your primary portfolio piece.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Spring Boot + Spring Data JPA + PostgreSQL","Full CRUD for Books, Members, Loans","DTOs for all request/response — never expose entities directly","Input validation with @Valid and custom error responses","Pagination on all list endpoints","Flyway migrations for schema changes","Swagger UI — every endpoint documented","Docker Compose: one command starts API + PostgreSQL","@SpringBootTest integration tests for every endpoint"],"search" fore March applications.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Contribute to 1 project regularly: TheAlgorithms, Exercism, Baeldung, Spring","Target 3+ merged PRs this phase","Write one technical blog post about something you built","If GSoC: start contributing to target org this phase"],"search":null,"clone":null}},{"name":"spring-ai-examples — read and extract","url":"https://github.com/spring-projects/spring-ai","type":"project","cost":"free","status":"alt","star":false,"desc":"Official Spring AI samples. Find the one closest to your goal. Read every file before writing any.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Pick the sample matching your goal: chat, RAG, function calling","Read every class. Understand the configuration.","Run it. Modify one parameter. Observe the change.","Then implement your own version in your Library API."],"search":null,"clone":"git clone https://github.com/spring-projects/spring-ai"}},{"name":"spring-petclinic — Docker branch","url":"https://github.com/spring-projects/spring-petclinic","type":"project","cost":"free","status":"alt","star":false,"desc":"Same project from P3, now run with Docker. See how production deployment differs.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Find and read docker-compose.yml line by line","Find health check configuration","Find environment variable injection","Compare to your own docker-compose — what did they do differently?"],"search":null,"clone":null}},{"name":"spring-petclinic — read and trace","url":"https://github.com/spring-projects/spring-petclinic","type":"project","cost":"free","status":"alt","star":false,"desc":"Official Spring reference app. Read this before writing any Spring code of your own.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Clone and run — fix environment first if needed","Trace ONE request: OwnerController to OwnerService to OwnerRepository to DB to response","Draw the flow on paper: Entity to Repository to Service to Controller","Find application.properties — understand every line","Modify something: add a field to an entity, add one endpoint"],"search":null,"clone":"git clone https://github.com/spring-projects/spring-petclinic"}},{"name":"Student Grade Manager","url":null,"type":"project","cost":"free","status":"alt","star":false,"desc":"Second project — adds file persistence. Start after Bank Account is fully tested.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Classes: Student, Course, Grade","Save and load from CSV file","Calculate GPA, letter grade, class rank","Handle missing file and corrupt data gracefully"],"search":"java student management system console github","clone":null}},{"name":"TheAlgorithms/Java — read and reimplement","url":"https://github.com/TheAlgorithms/Java","type":"project","cost":"free","status":"alt","star":false,"desc":"Clone it. Read LinkedList, Stack, Queue source. Run tests. Reimplement one from scratch without looking.","cat":"build","sub":"From the path","lang":"en","origin":["phase-projects"],"extra":{"steps":["Read source — do not copy it","Run existing tests: mvn test","Reimplement LinkedList from memory, then compare","Look for good-first-issue — this could be your first OSS PR"],"search":null,"clone":"git clone https://github.com/TheAlgorithms/Java"}}]}]},{"id":"method","name":"Study Method","blurb":"How to study, retain, and prompt AI well.","count":1,"subs":[{"name":"Main resources","items":[{"name":"Daily Habits System","url":"","type":"system","cost":"free","status":"start","star":true,"desc":"Three daily habits that run from P0 to P8: (1) 30 min English practice, (2) Problem solving on your current platform, (3) 15 min reading a book chapter or tech article. These compound over months into massive competitive advantages.","cat":"eng","sub":"Main resources","lang":"en","origin":["primary"],"extra":{"how":["English: Voscreen 10 min/day + AJ Hoge 7 Rules. Start iTalki conversations from P3.","Problem Solving: Follow the platform schedule in each phase. Never skip a day.","Reading: One book chapter per week from the 'later' shelf in your current phase."]}}]}]}],"method":{"method_cards":[{"num":"01","color":"#f5a623","title":"The Minimum Viable Concept Rule","body":"Never read an entire chapter before writing code. Read until you understand one concept, then immediately write it. Close the book. Write it without looking. If you can't — reopen, re-read, write again. Repeat until you can do it blind.","rule":"Read → Write → Close → Write again from memory"},{"num":"02","color":"#3ecfb2","title":"The Explain-It-Out-Loud Test","body":"Before moving to the next topic, explain what you just learned out loud — in Arabic, to an imaginary person. If you stumble, that's the exact gap you need to fill. This is the Feynman Technique adapted for developers.","rule":"If you can't explain it simply, you don't understand it yet"},{"num":"03","color":"#b57bee","title":"The Build-First Learning Loop","body":"Don't complete a course before building. After every 2–3 lessons, stop and build something that uses what you learned — even if it's ugly. The wall you hit while building tells you exactly what to learn next.","rule":"Learn minimum → Build → Hit wall → Learn what the wall requires → Continue"},{"num":"04","color":"#5b8dee","title":"The Spaced Review System","body":"Human memory decays exponentially. Every concept you learn needs to be reviewed at Day 1, Day 3, Day 7, and Day 14. Use a simple Obsidian note titled with the concept and the review dates. Takes 5 minutes per review.","rule":"Day 0 learn → Day 1 review → Day 3 review → Day 7 review → Day 14 review"},{"num":"05","color":"#e05c7a","title":"The Debug-Before-Google Rule","body":"When you hit a bug or error: read the stack trace top to bottom, identify the line, hypothesize the cause, try your fix first. Only Google after you have a formed hypothesis. This builds real debugging instinct that no course teaches.","rule":"Read error → Hypothesize → Try fix → Then (and only then) Google"},{"num":"06","color":"#47ffa0","title":"The Daily Commit Habit","body":"Every day you study, you commit something. Even if it's a README update, a refactor, or a test. Green squares on GitHub are a visual proof of consistency. Employers look at this. More importantly: it keeps you honest.","rule":"No commit = the day didn't happen professionally"},{"num":"07","color":"#ffb347","title":"The Anti-Tutorial Trap","body":"Tutorials create the illusion of learning. You follow along and the code works — but you didn't build it. After any tutorial: close it, delete the code you copied, and rebuild from scratch using only your notes. This reveals what you actually retained.","rule":"After tutorial: delete code → rebuild from scratch → commit that version"},{"num":"08","color":"#f07c4a","title":"The Context Switch Protocol","body":"When switching topics (e.g., from Java to SQL to Problem Solving), spend 5 minutes reviewing your notes from the previous session of EACH topic before starting. This prevents the \"I forgot everything I learned\" feeling after 2 weeks away.","rule":"5-min review before each session → prevents total context loss"}],"retention":[{"day":"D+0","color":"#f5a623","title":"Learn & Write Immediately","desc":"When you learn a concept, write code using it within the same session. Even a 10-line file. Name it clearly: HashMap_practice.java.","action":"Action: Open IDE → Write example → Commit"},{"day":"D+1","color":"#3ecfb2","title":"Recall Without Looking","desc":"Next day, before opening your notes, try to write the concept from memory. It will be imperfect — that's the point. The struggle to recall cements the memory.","action":"Action: Write what you remember first, then compare to notes"},{"day":"D+3","color":"#b57bee","title":"Apply in a Different Context","desc":"Use the same concept in a different mini-project or add it to your current build. Example: learned @Transactional — add it to your Library API service methods.","action":"Action: Find a place in your real project to apply it"},{"day":"D+7","color":"#5b8dee","title":"Teach It Back","desc":"Write a short note (even 5 bullet points) explaining the concept as if teaching someone else. Or create an Obsidian note. Or explain it to Claude and ask it to challenge your understanding.","action":"Action: Write explanation in your own words → paste to Claude → ask \"what did I miss?\""},{"day":"D+14","color":"#4caf8a","title":"Connect to What Came After","desc":"By now you've learned more. Come back and write how this concept connects to what you learned after it. E.g., \"HashMap → relates to how Spring's ApplicationContext stores beans\".","action":"Action: Update your note with connections to newer concepts"},{"day":"D+30","color":"#47ffa0","title":"Use It in an Interview","desc":"The ultimate retention test. Can you explain it confidently when asked in an interview? Use the AI Prompts \"Interview Practice\" prompt and specifically request a question about this concept.","action":"Action: Open AI Prompts tab → run \"Interview Practice\" on this concept"}],"daily_schedule":{"sprint":[{"time":"Fajr +30","act":"Review yesterday's notes","sub":"10 min — read without coding. What do you remember?"},{"time":"8:00–11:00","act":"Main learning block","sub":"MOOC.fi / spring.academy / project building. Zero interruptions. Build something after every module."},{"time":"11:30–12:30","act":"Coding practice","sub":"CodingBat or LeetCode. Timed. No hints for Easy problems."},{"time":"After Dhuhr","act":"Short review break","sub":"15 min: explain what you built this morning in Arabic"},{"time":"14:00–16:00","act":"Project work","sub":"Build your portfolio project or add features from this phase"},{"time":"After Asr","act":"Read + notes","sub":"30 min: Baeldung article, Spring docs, or book chapter"},{"time":"After Maghrib","act":"Light review","sub":"20 min: Anki-style recall of today's concepts"},{"time":"After Isha","act":"Commit + plan tomorrow","sub":"Git commit with real message. Write 3 goals for tomorrow."}],"marathon":[{"time":"Fajr +30","act":"Deep review session","sub":"20 min — review bugs, notes, and D+3 / D+7 spaced review items"},{"time":"Before work","act":"Focused depth block","sub":"Architecture, databases, DevOps, or AI integration — one theme at a time"},{"time":"Work hours","act":"Primary execution block","sub":"Ship tickets, document patterns, and collect real questions worth studying later"},{"time":"After Dhuhr","act":"Explain-it-out-loud drill","sub":"15 min: explain one work concept or bug fix in Arabic"},{"time":"After work","act":"Career maintenance","sub":"LeetCode medium, mock interview, or system design problem 30–60 min"},{"time":"After Asr","act":"Project or public artifact","sub":"Portfolio refinement, open source, blog post, README, or sandbox build"},{"time":"After Maghrib","act":"Parallel track block","sub":"AI tools, DevOps, or frontend empathy work — capped and intentional"},{"time":"After Isha","act":"Commit + review log","sub":"Commit, update notes, and set tomorrow's one high-leverage goal"}]},"gh_method":{"eval_questions":[{"n":"Q1","q":"What problem does this project solve? 30 sec from README — if unclear, skip."},{"n":"Q2","q":"What tech is used? Match it to your current phase."},{"n":"Q3","q":"How big is it? More than 50 files in P0-P1? Too big."},{"n":"Q4","q":"Educational or production? Know which before you start."},{"n":"Q5","q":"Can I run it in under 15 minutes? Bad README = skip."}],"daily_routine":[{"n":"1","s":"Read README (10 min)."},{"n":"2","s":"Run the project (15 min)."},{"n":"3","s":"Pick ONE feature (10 min)."},{"n":"4","s":"Trace the flow (20 min) — draw it."},{"n":"5","s":"Modify something (15 min). If you do not modify, you did not really learn."},{"n":"6","s":"Write a note (10 min): Project, Feature, Controller to Service to Repo."}]},"prompts":[{"phase":"Phase 1 — Java Core + OOP","cls":"java","items":[{"label":"Concept Explainer","text":"Explain [concept, e.g. polymorphism] in Java with a simple real-world analogy. Then show me a minimal 20-line code example. After the code, ask me one question to test my understanding."},{"label":"Generate Practice Project","text":"Generate a small Java console app for [e.g. a student grade tracker]. Use OOP principles (encapsulation, inheritance). Explain each class and why you structured it this way. Keep it under 80 lines total."},{"label":"Review My Code","text":"Review this Java code I wrote: [paste code]. Tell me: (1) what I did correctly, (2) any OOP violations or bad practices, (3) one specific improvement to make. Don't rewrite it for me — just guide me."},{"label":"Explain an Error","text":"I got this Java error: [paste error + code]. Explain in simple terms what caused it and what concept I'm missing. Then let me try to fix it myself before you show the solution."}]},{"phase":"Phase 2 — Spring Boot + REST APIs","cls":"spring","items":[{"label":"Generate Starter Project","text":"Generate a Spring Boot REST API for [e.g. a library management system] with full CRUD for one entity. Use Spring Data JPA + PostgreSQL. Explain each file: what it does and why it exists. Keep controllers thin."},{"label":"Explain Spring Concept","text":"Explain how [e.g. Spring Dependency Injection / @Transactional / Spring Security filter chain] works internally — not just how to use it, but what happens under the hood. Use a simple diagram description if helpful."},{"label":"Add a Feature","text":"I have this Spring Boot project structure: [describe or paste]. I want to add [feature, e.g. JWT authentication]. Don't write all the code — explain the steps first, then guide me through each one. I'll write the code and send it to you for review."},{"label":"Debug My API","text":"My Sprin /* ---------------------------------------------------------- state */
const KEY='reslib_v1', TKEY='reslib_theme_v1', CFGKEY='reslib_sync_v1';

/* Marks are {key: {v:'saved'|'done'|null, t:epochMillis}}.
   The timestamp is what lets two devices merge instead of clobber, and a
   null `v` is a tombstone so "I unmarked this" also syncs. */
let S={marks:{}};
let CFG={url:'',token:'',lastSync:0};

function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }

try{ S=Object.assign(S, JSON.parse(lsGet(KEY)||'{}')); }catch(e){}
try{ CFG=Object.assign(CFG, JSON.parse(lsGet(CFGKEY)||'{}')); }catch(e){}

/* Migrate the pre-sync format ({key:'saved'}) in place. */
(function migrate(){
  let changed=false;
  for(const k in S.marks){
    if(typeof S.marks[k]==='string'){ S.marks[k]={v:S.marks[k], t:1}; changed=true; }
  }
  if(changed) lsSet(KEY,JSON.stringify(S));
})();

const markOf = k => (S.marks[k]||{}).v || null;
function setMark(k,v){ S.marks[k]={v:v, t:Date.now()}; save(); queueSync(); }

let saveT; function save(){ clearTimeout(saveT); saveT=setTimeout(()=>lsSet(KEY,JSON.stringify(S)),250); }
function saveCfg(){ lsSet(CFGKEY,JSON.stringify(CFG)); }

/* Newer timestamp wins, per key. Commutative, so it doesn't matter which
   side runs it or in what order devices sync. */
function mergeMarks(a,b){
  const out=Object.assign({},a);
  for(const k in b){
    if(!out[k] || (b[k].t||0) > (out[k].t||0)) out[k]=b[k];
  }
  return out;
}

let CAT='java', STATUS='all', COST='all', FMT='all', LANG='all', Q='';

/* ---------------------------------------------------------- helpers */
const el=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function toast(m){ const t=el('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1900); }
const keyOf = r => r.name.toLowerCase();
const STATUS_MAP = Object.fromEntries(DATA.status.map(s=>[s.id,s]));

const ALL = DATA.categories.flatMap(c=>c.subs.flatMap(s=>s.items.map(r=>({...r, _cat:c.id}))));
const FORMATS = [...new Set(ALL.map(r=>r.type).filter(Boolean))].sort();

function matches(r){
  if(STATUS!=='all' && r.status!==STATUS) return false;
  if(COST==='free' && r.cost!=='free') return false;
  if(COST==='paid' && r.cost==='free') return false;
  if(FMT!=='all' && r.type!==FMT) return false;
  if(LANG!=='all' && r.lang!==LANG) return false;
  if(Q){
    const blob=(r.name+' '+(r.desc||'')).toLowerCase();
    if(!blob.includes(Q)) return false;
  }
  return true;
}

/* ---------------------------------------------------------- sync engine */
let SYNC={state:'off', msg:'', pending:0};

function syncLabel(){
  if(!CFG.url) return 'Sync not set up';
  if(SYNC.state==='busy') return 'Syncing…';
  if(SYNC.state==='err')  return SYNC.msg||'Sync failed';
  if(!navigator.onLine)   return 'Offline' + (SYNC.pending?' · '+SYNC.pending+' pending':'');
  if(CFG.lastSync){
    const m=Math.round((Date.now()-CFG.lastSync)/60000);
    return m<1?'Synced just now' : m<60?'Synced '+m+'m ago' : 'Synced '+Math.round(m/60)+'h ago';
  }
  return 'Not synced yet';
}
function renderSyncRow(){
  const cls = !CFG.url ? '' : SYNC.state==='busy' ? 'busy'
            : SYNC.state==='err' ? 'err' : (CFG.lastSync?'ok':'');
  el('syncrow').innerHTML='<span class="dot '+cls+'"></span><span>'+esc(syncLabel())+'</span>';
}

let syncT;
function queueSync(){
  if(!CFG.url) return;
  SYNC.pending++;
  clearTimeout(syncT);
  syncT=setTimeout(()=>doSync(), 1500);   // debounce bursts of clicking
  renderSyncRow();
}

async function doSync(opts){
  opts=opts||{};
  if(!CFG.url){ return; }
  if(SYNC.state==='busy') return;
  SYNC.state='busy'; renderSyncRow();
  try{
    const res=await fetch(CFG.url.replace(/\/+$/,'')+'/api/marks',{
      method:'PUT',
      headers:Object.assign({'Content-Type':'application/json'},
        CFG.token?{'Authorization':'Bearer '+CFG.token}:{}),
      body:JSON.stringify({marks:S.marks}),
    });
    if(!res.ok) throw new Error('HTTP '+res.status+(res.status===401?' — check the token':''));
    const body=await res.json();
    /* The server merges and returns the authoritative set; adopt it. */
    S.marks=mergeMarks(S.marks, body.marks||{});
    lsSet(KEY,JSON.stringify(S));
    CFG.lastSync=Date.now(); saveCfg();
    SYNC.state='ok'; SYNC.msg=''; SYNC.pending=0;
    render();
    if(opts.loud) toast('Synced — '+Object.keys(S.marks).length+' marks');
  }catch(err){
    SYNC.state='err'; SYNC.msg=String(err.message||err).slice(0,60);
    renderSyncRow();
    if(opts.loud) toast('Sync failed: '+SYNC.msg);
  }
}
window.addEventListener('online', ()=>{ if(CFG.url) doSync(); });

function resHTML(r){
  const k=keyOf(r), mark=markOf(k);
  const st=STATUS_MAP[r.status]||{label:r.status};
  const meta=[r.type, r.cost].filter(Boolean).join(' · ');
  const x=r.extra||{};
  const glyph = mark==='done' ? '✓' : (mark==='saved' ? '★' : '○');
  return '<div class="res'+(mark==='done'?' is-done':'')+'" data-k="'+esc(k)+'">'
    +'<button class="mark '+(mark||'')+'" data-mark="'+esc(k)+'" '
      +'title="Unmarked → Saved → Done">'+glyph+'</button>'
    +'<div class="rbody">'
      +'<div class="rtop">'
        +'<span class="rname">'+(r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.name)+'</a>':esc(r.name))+'</span>'
        +'<span class="status s-'+esc(r.status)+'">'+esc(st.label)+'</span>'
        +(meta?'<span class="meta">'+esc(meta)+'</span>':'')
        +(r.lang==='ar'?'<span class="meta tag-ar">العربية</span>':'')
      +'</div>'
      +(r.desc?'<div class="rdesc">'+esc(r.desc)+'</div>':'')
      +(x.how?'<ul class="how">'+x.how.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':'')
      +(x.steps?'<ul class="how">'+x.steps.slice(0,6).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':'')
      +(x.skills&&x.skills.length?'<div class="note">'+esc(x.skills.join(' · '))+'</div>':'')
      +(x.freq?'<div class="note">'+esc([x.when,x.freq,x.target].filter(Boolean).join(' · '))+'</div>':'')
    +'</div></div>';
}

function renderCategory(){
  const c=DATA.categories.find(x=>x.id===CAT);
  if(!c) return '';
  let shown=0, body='';
  c.subs.forEach(s=>{
    const list=s.items.filter(matches);
    if(!list.length) return;
    shown+=list.length;
    body+='<div class="sec">'+esc(s.name)+'</div>'+list.map(resHTML).join('');
  });
  el('count').textContent = shown+' of '+c.count;
  return '<h1 class="vhead">'+esc(c.name)+'</h1>'
    +'<p class="vsub">'+esc(c.blurb)+'</p>'
    +(shown?body:'<div class="empty">Nothing here matches those filters.</div>');
}

function renderMarked(kind){
  const list=ALL.filter(r=>markOf(keyOf(r))===kind && matches(r));
  el('count').textContent = list.length+'';
  const title = kind==='saved' ? 'Saved' : 'Done';
  const blurb = kind==='saved'
    ? 'Resources you have set aside to use.'
    : 'Resources you have finished.';
  if(!list.length) return '<h1 class="vhead">'+title+'</h1>'
    +'<p class="vsub">'+blurb+'</p>'
    +'<div class="empty">Nothing marked yet. Click the ○ beside any resource to cycle it: Saved → Done.</div>';
  const byCat={};
  list.forEach(r=>{ (byCat[r._cat]=byCat[r._cat]||[]).push(r); });
  return '<h1 class="vhead">'+title+'</h1><p class="vsub">'+blurb+'</p>'
    + DATA.categories.filter(c=>byCat[c.id]).map(c=>
        '<div class="sec">'+esc(c.name)+'</div>'+byCat[c.id].map(resHTML).join('')).join('');
}

  +'<div>Last sync &nbsp; '+(CFG.lastSync?new Date(CFG.lastSync).toLocaleString():'never')+'</div>'
  +'<div>Installed as app &nbsp; '+(installed?'yes':'no')+'</div>'
  +'<div>Offline cache &nbsp; '+('serviceWorker' in navigator
      ? (location.protocol==='file:'?'unavailable on file:// — host it to enable':'active')
      : 'not supported by this browser')+'</div>'
  +'</div>'

  +'<div class="sec">How merging works</div>'
  +'<p class="vsub">Every mark carries the moment you set it. When two devices disagree '
  +'about one resource, the newer change wins — per resource, not per device. '
  +'Unmarking is recorded too, so removing a mark on your phone does not come back '
  +'the next time your laptop syncs.</p>';
}

/* ---------------------------------------------------------- render */
function render(){
  renderCats(); renderFacets();
  if(CAT==='__sync') el('facets').innerHTML='';
  el('view').innerHTML =
      CAT==='__sync'  ? renderSync()
    : CAT==='method'  ? renderMethod()
    : CAT==='__saved' ? renderMarked('saved')
    : CAT==='__done'  ? renderMarked('done')
    : renderCategory();
  window.scrollTo({top:0,behavior:'instant'});
}

/* ---------------------------------------------------------- events */
document.body.addEventListener('click',e=>{
  const c=e.target.closest('#cats [data-cat]');
  if(c){ CAT=c.dataset.cat; el('sidebar').classList.remove('open'); render(); return; }

  const st=e.target.closest('[data-status]');
  if(st){ STATUS=st.dataset.status; render(); return; }

  const co=e.target.closest('[data-cost]');
  if(co){ COST = COST==='free' ? 'all' : 'free'; render(); return; }

  const lg=e.target.closest('[data-lang]');
  if(lg){ LANG = LANG==='ar' ? 'all' : 'ar'; render(); return; }

  const mk=e.target.closest('[data-mark]');
  if(mk){
    const k=mk.dataset.mark, cur=markOf(k);
    /* null is a tombstone, not a delete — otherwise "unmark" would be
       silently undone by whichever device still remembers the old value. */
    setMark(k, !cur ? 'saved' : cur==='saved' ? 'done' : null);
    render(); return;
  }

  if(e.target.id==='s-save'){
    CFG.url=el('s-url').value.trim(); CFG.token=el('s-token').value.trim();
    saveCfg(); render();
    if(CFG.url) doSync({loud:true}); else toast('Enter an API URL first');
    return;
  }
  if(e.target.id==='s-test'){
    const url=el('s-url').value.trim();
    if(!url){ toast('Enter an API URL first'); return; }
    fetch(url.replace(/\/+$/,'')+'/api/health')
      .then(r=>toast(r.ok?'Reachable — HTTP '+r.status:'Reached it, but HTTP '+r.status))
      .catch(err=>toast('Could not reach it: '+String(err.message||err).slice(0,50)));
    return;
  }
  if(e.target.id==='s-forget'){
    if(!confirm('Disconnect sync? Your marks stay on this device.')) return;
    CFG={url:'',token:'',lastSync:0}; saveCfg();
    SYNC={state:'off',msg:'',pending:0}; render(); toast('Disconnected');
    return;
  }

  const acc=e.target.closest('.acc-head');
  if(acc){ acc.parentElement.classList.toggle('closed'); return; }

  const cp=e.target.closest('[data-copy]');
  if(cp){
    if(navigator.clipboard) navigator.clipboard.writeText(cp.dataset.copy)
      .then(()=>toast('Prompt copied'),()=>toast('Copy failed'));
    else toast('Clipboard unavailable');
    return;
  }
});

document.body.addEventListener('change',e=>{
  if(e.target.id==='fmt'){ FMT=e.target.value; render(); }
});

el('search').addEventListener('input',e=>{
  Q=e.target.value.trim().toLowerCase();
  /* Searching looks across everything, not just the open category. */
  if(Q && CAT!=='method'){
    const hits=ALL.filter(matches);
    const byCat={};
    hits.forEach(r=>{ (byCat[r._cat]=byCat[r._cat]||[]).push(r); });
    el('count').textContent=hits.length+' found';
    el('view').innerHTML='<h1 class="vhead">Search</h1>'
      +'<p class="vsub">“'+esc(Q)+'” across all '+DATA.meta.total+' resources.</p>'
      +(hits.length
        ? DATA.categories.filter(c=>byCat[c.id]).map(c=>
            '<div class="sec">'+esc(c.name)+'</div>'
            +byCat[c.id].map(resHTML).join('')).join('')
        : '<div class="empty">No match.</div>');
  } else render();
});

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault(); el('search').focus(); el('search').select();
  }
  if(e.key==='Escape'){ el('search').value=''; Q=''; render(); }
});

el('menu-btn').onclick=()=>el('sidebar').classList.toggle('open');
el('btn-print').onclick=()=>window.print();
el('btn-theme').onclick=()=>{
  const cur=document.documentElement.dataset.theme==='light'?'dark':'light';
  document.documentElement.dataset.theme=cur; lsSet(TKEY,cur);
  el('btn-theme').textContent = cur==='light'?'Dark':'Light';
};
el('btn-reset').onclick=()=>{
  if(!confirm('Clear every Saved / Done mark on this device?\n\n'
    +'If sync is connected, tombstones are pushed so the other device clears too.')) return;
  const now=Date.now(), out={};
  for(const k in S.marks) out[k]={v:null,t:now};   // tombstones, not deletions
  S.marks=out; lsSet(KEY,JSON.stringify(S));
  render(); toast('Marks cleared');
  if(CFG.url) doSync();
};

/* ---------------------------------------------------------- boot */
(function(){
  const th=lsGet(TKEY); if(th) document.documentElement.dataset.theme=th;
  el('btn-theme').textContent =
    document.documentElement.dataset.theme==='light'?'Dark':'Light';
  el('brand-sub').textContent = DATA.meta.total+' resources · '+DATA.categories.length+' categories';
  render();

  /* A service worker needs a real origin — skip it silently on file://
     so the page still works when opened straight from disk. */
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  if(CFG.url) doSync();
})();
</script>
</body>
</html>
